; ================================
; RX8130 (RX8130CE, Built-in RTC)
; ================================
; --------------------------------
; UnitTest
; --------------------------------
; Built-in RX8130CE on the internal I2C bus
[env:test_RX8130_Tab5]
extends=Tab5, option_release, pioarduino_latest
build_flags = ${Tab5.build_flags}
  ${option_release.build_flags}
lib_deps = ${Tab5.lib_deps}
  ${test_fw.lib_deps}
test_filter= embedded/test_rx8130
