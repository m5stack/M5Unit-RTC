; --------------------------------
; Examples UnitRTC
; --------------------------------
;NTPSync
; NanoH2 (ESP32-H2) has no Wi-Fi, so it is not listed
; Wi-Fi credentials can be given with build_flags (or the PLATFORMIO_BUILD_FLAGS environment variable):
;  -DEXAMPLE_SSID="\"YOUR_SSID\""
;  -DEXAMPLE_PASSWORD="\"PASSWORD\""
[env:UnitRTC_NTPSync_Core_Arduino_latest]
extends=Core, option_release, arduino_latest
build_src_filter = +<*> -<.git/> -<.svn/>
  +<../examples/UnitUnified/UnitRTC/NTPSync/>
  -<../examples/UnitUnified/UnitRTC/NTPSync/build/>
  -<../examples/UnitUnified/UnitRTC/NTPSync/managed_components/>

